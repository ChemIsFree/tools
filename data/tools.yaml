# ChemIsFree Tool Catalogue
#
# Structured metadata for tools and resources included
# in the ChemIsFree catalogue.
#
# Schema: data/schema.yaml

tools:

  - id: rdkit
    name: RDKit
    description: >
      Open-source cheminformatics and machine-learning software for
      working with molecular structures, descriptors, fingerprints,
      molecular databases, and related chemical data.
    category:
      - cheminformatics
      - machine-learning
    type: library
    access:
      - free
    source_available: true
    license: BSD-3-Clause
    platforms:
      - linux
      - macos
      - windows
    interface:
      - python
      - c++
    languages:
      - c++
      - python
    gpu: not-required
    installation:
      - conda
      - source
    status: active
    developers:
      - RDKit community
    website: https://www.rdkit.org/
    repository: https://github.com/rdkit/rdkit
    documentation: https://www.rdkit.org/docs/
    citation:
      - https://doi.org/10.1186/s13321-017-0232-0
    chemisfree_status: curated-resource
    notes: >
      RDKit is an open-source collection of cheminformatics and
      machine-learning software.

  - id: gnina
    name: GNINA
    description: >
      Deep-learning-enhanced molecular docking software incorporating
      convolutional neural network scoring and optimization.
    category:
      - drug-discovery
      - molecular-modelling
      - machine-learning
    type: software
    access:
      - free
    source_available: true
    license: dual
    platforms:
      - linux
      - macos
    interface:
      - cli
    languages:
      - c++
      - python
    gpu: recommended
    installation:
      - source
      - binary
    status: active
    developers:
      - GNINA contributors
    website: https://gnina.github.io/gnina/
    repository: https://github.com/gnina/gnina
    documentation: https://github.com/gnina/gnina/tree/master/docs
    citation:
      - https://doi.org/10.1021/acs.jcim.8b00572
    chemisfree_status: curated-resource
    notes: >
      GNINA is a deep-learning-enhanced docking program based on smina.
      The project incorporates convolutional neural networks for scoring
      and ligand optimization.

  - id: openmm
    name: OpenMM
    description: >
      Toolkit for molecular simulation that can be used as a
      stand-alone application or as a library for custom simulations.
    category:
      - molecular-modelling
    type: library
    access:
      - free
    source_available: true
    license: multiple
    platforms:
      - linux
      - macos
      - windows
    interface:
      - python
      - c++
      - cli
    languages:
      - c++
      - python
    gpu: optional
    installation:
      - conda
      - pip
      - source
    status: active
    developers:
      - OpenMM community
    website: https://openmm.org/
    repository: https://github.com/openmm/openmm
    documentation: https://docs.openmm.org/
    citation:
      - https://doi.org/10.1371/journal.pcbi.1005659
    chemisfree_status: curated-resource
    notes: >
      OpenMM is open-source molecular simulation software supporting
      CPU and GPU-accelerated calculations.

  - id: chembl
    name: ChEMBL
    description: >
      Open-access database of manually curated bioactivity data
      covering small molecules and their biological activities.
    category:
      - data-and-databases
      - drug-discovery
    type: database
    access:
      - free
      - open-data
    source_available: true
    license: CC BY-SA 3.0
    platforms:
      - web
    interface:
      - web
      - api
    languages: []
    gpu: not-required
    installation:
      - web
    status: active
    developers:
      - ChEMBL team
      - EMBL-EBI
    website: https://www.ebi.ac.uk/chembl/
    repository: https://github.com/chembl
    documentation: https://chembl.gitbook.io/chembl-interface-documentation/
    citation: []
    chemisfree_status: curated-resource
    notes: >
      ChEMBL is maintained by EMBL-EBI and provides programmatic access
      to curated bioactivity data through web services and downloadable
      database resources.

  - id: pymol-open-source
    name: PyMOL Open-Source
    description: >
      Open-source molecular visualization software for viewing,
      analyzing, and presenting molecular structures.
    category:
      - visualization
      - molecular-modelling
    type: software
    access:
      - free
    source_available: true
    license: BSD-like
    platforms:
      - linux
      - macos
      - windows
    interface:
      - gui
      - python
    languages:
      - c
      - c++
      - python
    gpu: optional
    installation:
      - conda
      - source
      - binary
    status: active
    developers:
      - PyMOL community
      - Schrödinger
    website: https://www.pymol.org/
    repository: https://github.com/schrodinger/pymol-open-source
    documentation: https://pymol.org/dokuwiki/
    citation: []
    chemisfree_status: curated-resource
    notes: >
      This entry refers specifically to the open-source PyMOL project.
      PyMOL is also distributed as a commercial product by Schrödinger.

  - id: catalist
    name: CataList
    description: >
      Desktop chemical inventory management software for laboratories
      and researchers, providing chemical structure generation,
      molecular property calculation, chemical classification, and
      exact, substructure, and similarity searching.
    category:
      - cheminformatics
    type: software
    access:
      - free
    source_available: false
    license: not-specified
    platforms:
      - desktop
    interface:
      - gui
    languages:
      - java
    gpu: not-required
    installation:
      - binary
    status: active
    developers:
      - Dionysis Kampasis
    website: https://github.com/DionysisKampasis/CataList
    repository: https://github.com/DionysisKampasis/CataList
    documentation: https://github.com/DionysisKampasis/CataList
    citation: []
    chemisfree_status: chemisfree-project
    notes: >
      CataList is a ChemIsFree project developed by Dionysis Kampasis.
      The application is provided free of charge for personal and
      commercial use.
