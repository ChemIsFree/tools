name: Generate category pages

on:
  push:
    paths:
      - "data/tools.yaml"
      - "data/schema.yaml"
      - ".github/scripts/generate_categories.py"
      - ".github/workflows/generate-categories.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate category pages
        run: python .github/scripts/generate_categories.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add categories/

          if git diff --cached --quiet; then
            echo "No category changes."
          else
            git commit -m "Automatically update category pages"
            git push
          fi
