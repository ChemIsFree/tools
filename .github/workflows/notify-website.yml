name: Notify ChemIsFree website of catalogue changes

on:
  push:
    branches:
      - main
    paths:
      - "data/tools.yaml"
      - "data/taxonomy.yaml"
      - "data/category_curation.yaml"
      - "data/assayer_free_registry.json"
      - ".github/workflows/notify-website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-website:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website rebuild
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          CATALOGUE_COMMIT: ${{ github.sha }}
        run: |
          curl \
            --fail \
            --request POST \
            --url https://api.github.com/repos/ChemIsFree/website/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${WEBSITE_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --data "{
              \"event_type\": \"catalogue-updated\",
              \"client_payload\": {
                \"source\": \"ChemIsFree/tools\",
                \"commit\": \"${CATALOGUE_COMMIT}\"
              }
            }"
