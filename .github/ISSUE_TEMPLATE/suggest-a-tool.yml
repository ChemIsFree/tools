```yaml
name: Suggest a tool

description: Suggest a software application or supporting resource for the ChemIsFree catalogue.

title: "[Tool suggestion]: "

labels:
  - tool-submission
  - needs-review

body:

  - type: markdown
    attributes:
      value: |
        ## Suggest a resource for ChemIsFree

        Thank you for helping expand the ChemIsFree catalogue.

        ChemIsFree is organized around what researchers need to do,
        rather than around generic software categories.

        Please provide as much information as you know.
        You do not need to fill in information you do not know.


  # ---------------------------------------------------------
  # BASIC CLASSIFICATION
  # ---------------------------------------------------------

  - type: dropdown
    id: catalogue
    attributes:
      label: Catalogue section
      description: Should this appear as a primary application or as a supporting resource?
      options:
        - Application
        - Supporting Resource
    validations:
      required: true


  - type: dropdown
    id: domain
    attributes:
      label: Main area
      description: Choose the major area where users would look for this resource.
      options:
        - Chemical Structures
        - Ligand-Based Discovery
        - Structure-Based Discovery
        - Molecular Properties & ADMET
        - Synthesis & Reaction Design
        - Data & Chemical Analysis
        - Visualization & Interpretation
        - Laboratory & Workflows
    validations:
      required: true


  - type: dropdown
    id: primary_task
    attributes:
      label: Primary task
      description: What is the main thing this resource helps a researcher do?
      options:

        # Chemical Structures
        - Inventory Management
        - Draw & Edit Structures
        - Structure Elucidation
        - Molecular Descriptors & Properties
        - Structure Search
        - Structure Conversion
        - Ligand Preparation
        - Chemical Space Analysis

        # Ligand-Based Discovery
        - Pharmacophore Modelling
        - QSAR & Predictive Modelling
        - Scaffold Analysis
        - Ligand-Based Virtual Screening

        # Structure-Based Discovery
        - Protein Preparation
        - Binding-Site Analysis
        - Molecular Docking
        - Structure-Based Virtual Screening
        - Molecular Dynamics
        - Interaction Analysis
        - Free-Energy Calculations

        # Molecular Properties & ADMET
        - Physicochemical Properties
        - ADME Prediction
        - Toxicity Prediction
        - Drug-Likeness

        # Synthesis & Reaction Design
        - Retrosynthesis
        - Reaction Prediction
        - Synthetic Route Planning
        - Reaction Analysis

        # Data & Chemical Analysis
        - Bioactivity Analysis
        - Data Curation
        - Chemical Data Analysis
        - Machine Learning
        - Generative Chemistry

        # Visualization & Interpretation
        - Molecular Visualization
        - 3D Structure Analysis
        - Trajectory Analysis
        - Scientific Visualization

        # Laboratory & Workflows
        - Laboratory Automation
        - Workflow Construction
        - Pipeline Execution

    validations:
      required: true


  - type: checkboxes
    id: additional_tasks
    attributes:
      label: Additional tasks
      description: Select any other tasks this resource meaningfully supports.
      options:

        # Chemical Structures
        - label: Inventory Management
        - label: Draw & Edit Structures
        - label: Structure Elucidation
        - label: Molecular Descriptors & Properties
        - label: Structure Search
        - label: Structure Conversion
        - label: Ligand Preparation
        - label: Chemical Space Analysis

        # Ligand-Based Discovery
        - label: Pharmacophore Modelling
        - label: QSAR & Predictive Modelling
        - label: Scaffold Analysis
        - label: Ligand-Based Virtual Screening

        # Structure-Based Discovery
        - label: Protein Preparation
        - label: Binding-Site Analysis
        - label: Molecular Docking
        - label: Structure-Based Virtual Screening
        - label: Molecular Dynamics
        - label: Interaction Analysis
        - label: Free-Energy Calculations

        # Molecular Properties & ADMET
        - label: Physicochemical Properties
        - label: ADME Prediction
        - label: Toxicity Prediction
        - label: Drug-Likeness

        # Synthesis & Reaction Design
        - label: Retrosynthesis
        - label: Reaction Prediction
        - label: Synthetic Route Planning
        - label: Reaction Analysis

        # Data & Chemical Analysis
        - label: Bioactivity Analysis
        - label: Data Curation
        - label: Chemical Data Analysis
        - label: Machine Learning
        - label: Generative Chemistry

        # Visualization & Interpretation
        - label: Molecular Visualization
        - label: 3D Structure Analysis
        - label: Trajectory Analysis
        - label: Scientific Visualization

        # Laboratory & Workflows
        - label: Laboratory Automation
        - label: Workflow Construction
        - label: Pipeline Execution


  # ---------------------------------------------------------
  # BASIC INFORMATION
  # ---------------------------------------------------------

  - type: input
    id: name
    attributes:
      label: Tool or resource name
      description: The official name of the resource.
      placeholder: e.g. RDKit
    validations:
      required: true


  - type: textarea
    id: description
    attributes:
      label: What does it do?
      description: Give a concise description of what the resource is used for.
      placeholder: |
        A cheminformatics toolkit for working with molecular structures,
        descriptors, fingerprints, and chemical data.
    validations:
      required: true


  # ---------------------------------------------------------
  # LINKS
  # ---------------------------------------------------------

  - type: input
    id: website
    attributes:
      label: Official website
      description: The official website, if available.
      placeholder: https://example.org


  - type: input
    id: repository
    attributes:
      label: Source repository
      description: Official GitHub, GitLab, or other source repository, if available.
      placeholder: https://github.com/example/project


  - type: input
    id: documentation
    attributes:
      label: Documentation
      description: Official documentation, manual, or user guide, if available.
      placeholder: https://docs.example.org


  # ---------------------------------------------------------
  # TYPE / ACCESS
  # ---------------------------------------------------------

  - type: dropdown
    id: resource_type
    attributes:
      label: Resource type
      description: Select the appropriate type. Applications should use "Not applicable".
      options:
        - Not applicable — Application
        - Library
        - Database
        - Dataset
        - Educational
    validations:
      required: true


  - type: dropdown
    id: access
    attributes:
      label: Access
      description: ChemIsFree focuses on freely accessible resources.
      options:
        - Free
        - Open Source
        - Unknown / needs verification
    validations:
      required: true


  - type: input
    id: license
    attributes:
      label: License
      description: If known, provide the license.
      placeholder: e.g. MIT, Apache-2.0, GPL-3.0, CC BY 4.0


  # ---------------------------------------------------------
  # INTERFACE / AVAILABILITY
  # ---------------------------------------------------------

  - type: checkboxes
    id: interface
    attributes:
      label: User interface
      description: Select the interfaces a researcher can directly use.
      options:
        - label: GUI
        - label: Web
        - label: Command line


  - type: input
    id: languages
    attributes:
      label: Languages / technologies
      description: Optional. List programming languages or major technologies used by the project.
      placeholder: e.g. Python, C++, Java


  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms
      description: Select all that apply.
      options:
        - label: Linux
        - label: macOS
        - label: Windows
        - label: Web
        - label: Android
        - label: iOS
        - label: Desktop
        - label: Cloud
        - label: Other


  # ---------------------------------------------------------
  # DEVELOPER / SCIENTIFIC INFORMATION
  # ---------------------------------------------------------

  - type: input
    id: developers
    attributes:
      label: Developer or organization
      description: Who develops or maintains the resource?
      placeholder: e.g. EMBL-EBI


  - type: input
    id: citation
    attributes:
      label: Scientific citation
      description: DOI or publication describing the resource, if available.
      placeholder: https://doi.org/...


  - type: textarea
    id: why
    attributes:
      label: Why should ChemIsFree include it?
      description: Briefly explain why this resource would be useful to the chemistry or drug-discovery community.
      placeholder: |
        Useful for molecular similarity searching and descriptor calculation.
    validations:
      required: true


  - type: input
    id: submitter
    attributes:
      label: Your name or project
      description: Optional.
      placeholder: Your name, GitHub username, laboratory, or project


  # ---------------------------------------------------------
  # CONFIRMATION
  # ---------------------------------------------------------

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have provided the information in good faith and understand that ChemIsFree may verify or modify the submitted metadata.
          required: true

        - label: I understand that inclusion in the catalogue does not imply ownership, development, endorsement, or maintenance by ChemIsFree.
          required: true
```
