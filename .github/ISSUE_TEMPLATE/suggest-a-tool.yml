name: Suggest a tool

description: Suggest a software tool, database, dataset, workflow, or other resource for the ChemIsFree catalogue.

title: "[Tool suggestion]: "

labels:
  - tool-submission
  - needs-review

body:

  - type: markdown
    attributes:
      value: |
        ## Suggest a resource for ChemIsFree

        Thank you for helping expand the ChemIsFree catalogue.

        You can suggest software, libraries, databases, datasets,
        web tools, workflows, platforms, tutorials, or other useful
        resources for chemistry and drug discovery.

        Please provide as much information as you know. You do not
        need to fill in information that you do not know.

  - type: input
    id: name
    attributes:
      label: Tool or resource name
      description: The official name of the resource.
      placeholder: e.g. RDKit
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What does it do?
      description: Give a short description of what the resource is used for.
      placeholder: |
        A cheminformatics toolkit for working with molecular structures,
        descriptors, fingerprints, and chemical data.
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Main category
      description: Choose the category that best describes the resource.
      options:
        - Cheminformatics
        - Molecular Modelling
        - Drug Discovery
        - Machine Learning
        - Data & Databases
        - Visualization
        - Laboratory
        - Utilities & Workflows
        - Other
    validations:
      required: true

  - type: input
    id: website
    attributes:
      label: Official website
      description: The official website of the resource, if available.
      placeholder: https://example.org

  - type: input
    id: repository
    attributes:
      label: Source repository
      description: GitHub, GitLab, or another official source repository, if available.
      placeholder: https://github.com/example/project

  - type: input
    id: documentation
    attributes:
      label: Documentation
      description: Official documentation, manual, or user guide, if available.
      placeholder: https://docs.example.org

  - type: dropdown
    id: type
    attributes:
      label: Resource type
      description: Choose the type that best describes the resource.
      options:
        - Software
        - Library
        - Database
        - Dataset
        - Web Tool
        - Web Service
        - Workflow
        - Platform
        - Resource
        - Tutorial
        - Other
    validations:
      required: true

  - type: dropdown
    id: access
    attributes:
      label: Access
      description: How can users access the resource?
      options:
        - Free
        - Free tier
        - Open data
        - Public
        - Paid
        - Unknown
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: License
      description: If known, provide the license or access terms.
      placeholder: e.g. MIT, Apache-2.0, GPL-3.0, CC BY 4.0

  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms
      description: Select all that apply.
      options:
        - label: Linux
        - label: macOS
        - label: Windows
        - label: Web
        - label: Android
        - label: iOS
        - label: Desktop
        - label: Cloud
        - label: Other

  - type: checkboxes
    id: interface
    attributes:
      label: Interface
      description: Select all that apply.
      options:
        - label: GUI
        - label: Command line
        - label: Python
        - label: R
        - label: C++
        - label: Java
        - label: API
        - label: Web
        - label: Notebook
        - label: Other

  - type: input
    id: developers
    attributes:
      label: Developer or organization
      description: Who develops or maintains the resource?
      placeholder: e.g. EMBL-EBI

  - type: input
    id: citation
    attributes:
      label: Scientific citation
      description: DOI or publication describing the resource, if available.
      placeholder: https://doi.org/...

  - type: textarea
    id: why
    attributes:
      label: Why should ChemIsFree include it?
      description: Tell us briefly why this resource would be useful to the chemistry/drug-discovery community.
      placeholder: |
        Useful for molecular similarity searching and descriptor calculation.
    validations:
      required: true

  - type: input
    id: submitter
    attributes:
      label: Your name or project
      description: Optional. Tell us who submitted this resource.
      placeholder: Your name, GitHub username, laboratory, or project

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have provided information in good faith and understand that ChemIsFree may verify or modify the submitted metadata.
          required: true
        - label: I understand that inclusion in the ChemIsFree catalogue does not imply ownership or development by ChemIsFree.
          required: true
